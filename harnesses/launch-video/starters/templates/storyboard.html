<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story</title>
<!-- One-click feedback for a selected beat. These are STORY notes, not polish notes. Keep or adapt. -->
<meta name="lva:chips" content='[["Stronger hook","Make the hook stronger: open on the sharpest, most surprising moment."],["Cut this beat","Cut this beat."],["Swap with previous","Swap this beat with the previous one."],["Add a beat before","Add a short beat before this one that sets it up."],["Shorter","Make this beat shorter."]]'>
<!--
  STARTING POINT, not a final page. Copy to storyboard.html and replace the sample content.
  This is a LOW-FIDELITY STORY WIREFRAME: the user reviews the story (hook, order, payoff), not the look.
  So: grayscale only, dashed boxes with bracketed labels, arrows for movement, at most six elements per frame,
  no brand colors, no photos, no real fonts, no polish. Text on the page: logline, beat title, time, ONE line
  saying the beat's job in the story. No paragraphs.
  Contract, keep it:
    - one  data-lva-beat  card per beat, also carrying  data-lva-scene="<n>" data-lva-title="<title>"
    - the hidden plan:  <script type="application/json" id="lva-plan">  with per-beat title, start, end,
      on-screen text, what is on screen, motion (you build the video from it; it is never shown)
    - the button  <button data-lva-send="Story approved. Build the video.">
    - <script src="_lva/bridge.js"></script> at the end of <body>, and a .lva-selected style
-->
<style>
  :root { --ink:#222; --mute:#777; --line:#cfcac0; --paper:#fbfaf6; --hi:#c2552b; --hi-soft:#fbeee8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--paper); color:var(--ink); font:14px/1.35 system-ui,-apple-system,sans-serif; }
  .hand { font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive; }
  .top { display:flex; align-items:flex-start; gap:16px; margin-bottom:6px; }
  .top h1 { margin:0; font-size:19px; font-weight:600; } .logline { margin:4px 0 0; color:#444; max-width:640px; }
  .approve { margin-left:auto; flex:none; font:600 13px system-ui; background:var(--ink); color:#fff; border:0; border-radius:8px; padding:9px 16px; cursor:pointer; }
  .spine { display:flex; gap:6px; margin:10px 0 18px; } .spine span { font:600 12px system-ui; border:1.5px solid var(--ink); border-radius:14px; padding:2px 10px; }
  .spine i { align-self:center; color:var(--mute); font-style:normal; }
  .strip { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
  figure.beat { margin:0; background:#fff; border:2px solid var(--ink); border-radius:6px; padding:8px; cursor:pointer; }
  figure.beat:hover { background:#fffdf8; }
  figure.beat.lva-selected { border-color:var(--hi); box-shadow:0 0 0 3px var(--hi-soft); }
  /* the wireframe: a 16:9 sheet; place elements with % so it scales */
  .wf { position:relative; aspect-ratio:16/9; background:repeating-linear-gradient(45deg,#f4f2ec 0 6px,#fbfaf6 6px 12px); border:1.5px solid var(--line); overflow:hidden; font-size:11px; }
  .bx { position:absolute; border:1.5px dashed #555; border-radius:3px; display:flex; align-items:center; justify-content:center; color:#555; background:rgba(255,255,255,.65); text-align:center; padding:2px; }
  .bx.solid { border-style:solid; border-color:#222; color:#222; }
  .ln { position:absolute; height:5px; background:#c9c5ba; border-radius:3px; }
  .ar { position:absolute; color:#555; font-size:18px; line-height:1; }
  figcaption { margin:8px 2px 0; } .cap1 { display:flex; gap:8px; align-items:baseline; font-weight:600; }
  .cap1 .n { font:700 11px ui-monospace,monospace; color:var(--mute); } .cap1 .t { margin-left:auto; font:400 11px ui-monospace,monospace; color:var(--mute); }
  .job { margin:2px 0 0; color:var(--mute); font-size:12.5px; }
  .map { display:flex; gap:3px; margin-top:20px; height:26px; } .map div { border:1.5px solid var(--ink); border-radius:4px; font:600 11px ui-monospace,monospace; padding:3px 6px; overflow:hidden; white-space:nowrap; background:#fff; }
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>The story</h1>
    <p class="logline hand">One sentence: who has what problem, what the product does about it, and the payoff.</p>
  </div>
  <button class="approve" data-lva-send="Story approved. Build the video.">Story works → build video</button>
</div>
<div class="spine"><span>Problem</span><i>→</i><span>Product</span><i>→</i><span>Payoff</span></div>

<div class="strip">
  <figure class="beat" data-lva-beat data-lva-scene="1" data-lva-title="Hook">
    <div class="wf hand">
      <div class="bx solid" style="left:10%;top:30%;width:80%;height:26%">[Headline: the sharpest claim]</div>
      <div class="ln" style="left:10%;top:66%;width:50%"></div>
      <div class="ln" style="left:10%;top:76%;width:34%"></div>
    </div>
    <figcaption><div class="cap1"><span class="n">1</span>Hook<span class="t">0–3s</span></div><p class="job">Grab attention with the sharpest contrast.</p></figcaption>
  </figure>
  <figure class="beat" data-lva-beat data-lva-scene="2" data-lva-title="Product">
    <div class="wf hand">
      <div class="bx" style="left:8%;top:12%;width:56%;height:70%">[App window]</div>
      <div class="bx" style="left:70%;top:20%;width:22%;height:22%">[Cursor]</div>
      <div class="ar" style="left:66%;top:30%">→</div>
    </div>
    <figcaption><div class="cap1"><span class="n">2</span>Product<span class="t">3–9s</span></div><p class="job">Show the product doing the thing.</p></figcaption>
  </figure>
  <!-- one figure per beat -->
</div>

<!-- Beat map: proportional to each beat's length -->
<div class="map"><div style="flex:3">1 Hook</div><div style="flex:6">2 Product</div></div>

<script type="application/json" id="lva-plan">
{ "beats": [
  { "title": "Hook", "start": 0, "end": 3, "text": "…", "onScreen": "…", "motion": "…" },
  { "title": "Product", "start": 3, "end": 9, "text": "…", "onScreen": "…", "motion": "…" }
] }
</script>
<script src="_lva/bridge.js"></script>
</body>
</html>
