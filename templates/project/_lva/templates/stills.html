<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stills</title>
<!--
  STARTING POINT, not a final page. Copy to ../../stills.html and adapt.
  One still per scene of the chosen board. Each still is a FROZEN FRAME OF THE REAL VIDEO PAGE: an iframe of
  video.html?still=<seconds>. Pick the most representative moment of each scene (usually late in its entrance,
  once the layout has settled). Restyle the page freely. The app depends on this contract, keep it:
    - one  data-lva-still  figure per scene, also carrying  data-lva-scene="<n>" data-lva-title="<title>"
      (clicking a figure makes it the target of the next chat note)
    - the iframe inside has pointer-events:none so the click reaches the figure
    - an "Approve all" button:  <button data-lva-send="All stills approved. Build the video.">
    - <script src="_lva/bridge.js"></script> at the end of <body>, and a .lva-selected style
-->
<style>
  :root { --ink:#1a1a1a; --mute:#6b6b6b; --line:#e4e1da; --bg:#faf9f6; --accent:#c2552b; --accent-soft:#fbeee8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,sans-serif; }
  .top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .top p { margin:0; color:var(--mute); font-size:12.5px; }
  .approve { margin-left:auto; font:600 13px system-ui; background:var(--ink); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  figure { margin:0; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:10px; cursor:pointer; }
  figure:hover { border-color:var(--ink); }
  figure.lva-selected { border-color:var(--accent); background:var(--accent-soft); }
  .frame { aspect-ratio:16/9; border-radius:6px; overflow:hidden; background:#000; }
  .frame iframe { width:100%; height:100%; border:0; pointer-events:none; }
  figcaption { margin-top:8px; display:flex; gap:8px; align-items:baseline; font-weight:600; }
  figcaption .n { font:600 11px ui-monospace,monospace; color:var(--mute); }
  figcaption .t { margin-left:auto; font:400 11px ui-monospace,monospace; color:var(--mute); }
</style>
</head>
<body>
<div class="top">
  <p>Click a still to leave a note on exactly that scene. Approve when they all look right.</p>
  <button class="approve" data-lva-send="All stills approved. Build the video.">Approve all → build video</button>
</div>
<div class="grid">
  <figure data-lva-still data-lva-scene="1" data-lva-title="Hook">
    <div class="frame"><iframe src="video.html?still=1.8" title="Hook"></iframe></div>
    <figcaption><span class="n">1</span>Hook<span class="t">@1.8s</span></figcaption>
  </figure>
  <!-- one figure per scene -->
</div>
<script src="_lva/bridge.js"></script>
</body>
</html>
