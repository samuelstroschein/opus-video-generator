<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboards</title>
<!--
  STARTING POINT, not a final page. Copy to ../../storyboards.html and replace the sample content.
  You may change layout, typography and styling freely (using the product's brand is welcome).
  The app depends on this contract, keep it:
    - one  data-lva-board="A|B|C"  element per board (exactly three boards)
    - one  data-lva-scene="<n>" data-lva-title="<title>"  element per scene inside its board
      (also keep data-start / data-end in seconds so later stages can read timings)
    - <script src="_lva/bridge.js"></script> at the end of <body>
    - a .lva-selected style so the clicked scene is visibly highlighted
    - one Pick button per board:  <button class="pick" data-lva-send="Go with Board B. Build the scene stills.">Pick B</button>
      (data-lva-send makes the host send that text as a chat message)
  Fully self-contained: inline CSS/JS, no external fonts, scripts or images.
-->
<style>
  :root { --ink:#1a1a1a; --mute:#6b6b6b; --line:#e4e1da; --bg:#faf9f6; --accent:#c2552b; --accent-soft:#fbeee8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,sans-serif; }
  .hint { margin:0 0 12px; color:var(--mute); font-size:12.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; align-items:start; }
  .board { background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .board h2 { margin:0; font-size:15px; display:flex; align-items:baseline; gap:8px; }
  .board h2 .id { font:700 11px ui-monospace,monospace; background:var(--ink); color:#fff; border-radius:4px; padding:2px 6px; }
  .board h2 .dur { margin-left:auto; font:500 12px ui-monospace,monospace; color:var(--mute); }
  .strategy { margin:0; color:var(--mute); font-size:13px; }
  .bar { display:flex; gap:2px; height:8px; }
  .bar i { display:block; background:var(--line); border-radius:2px; }
  .pick { margin-top:auto; font:600 13px system-ui; background:var(--ink); color:#fff; border:0; border-radius:6px; padding:7px 10px; cursor:pointer; }
  .scene { text-align:left; width:100%; font:inherit; color:inherit; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
  .scene:hover { border-color:var(--ink); }
  .scene.lva-selected { border:1.5px solid var(--accent); background:var(--accent-soft); }
  .scene .top { display:flex; gap:8px; align-items:baseline; font-weight:600; }
  .scene .n { font:600 11px ui-monospace,monospace; color:var(--mute); }
  .scene .t { margin-left:auto; font:400 11px ui-monospace,monospace; color:var(--mute); }
  .scene .v { font-size:12.5px; color:#444; }
  .scene .m { font-size:12.5px; color:var(--mute); font-style:italic; }
  .scene .txt { font:600 12px ui-monospace,monospace; color:var(--accent); }
</style>
</head>
<body>
<p class="hint">Click a scene to leave a note on exactly that scene.</p>
<div class="grid">

  <section class="board" data-lva-board="A">
    <h2><span class="id">A</span>Fast cuts<span class="dur">9s</span></h2>
    <p class="strategy">One sentence on the strategic bet this board makes.</p>
    <div class="bar"><i style="flex:3"></i><i style="flex:4"></i><i style="flex:2"></i></div>
    <button class="scene" data-lva-scene="1" data-lva-title="Hook" data-start="0" data-end="3">
      <span class="top"><span class="n">1</span>Hook<span class="t">0–3s</span></span>
      <span class="v">What the viewer sees, concretely.</span>
      <span class="m">Camera and animation direction.</span>
      <span class="txt">“Exact on-screen words”</span>
    </button>
    <button class="scene" data-lva-scene="2" data-lva-title="Product" data-start="3" data-end="7">
      <span class="top"><span class="n">2</span>Product<span class="t">3–7s</span></span>
      <span class="v">…</span><span class="m">…</span><span class="txt">“…”</span>
    </button>
    <button class="scene" data-lva-scene="3" data-lva-title="CTA" data-start="7" data-end="9">
      <span class="top"><span class="n">3</span>CTA<span class="t">7–9s</span></span>
      <span class="v">…</span><span class="m">…</span><span class="txt">“…”</span>
    </button>
    <button class="pick" data-lva-send="Go with Board A. Build the scene stills.">Pick A</button>
  </section>

  <section class="board" data-lva-board="B"><!-- same structure as A --></section>
  <section class="board" data-lva-board="C"><!-- same structure as A --></section>

</div>
<script src="_lva/bridge.js"></script>
</body>
</html>
