<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboards</title>
<style>
  :root { --ink:#1a1a1a; --mute:#6b6b6b; --line:#e4e1da; --bg:#faf9f6; --accent:oklch(0.55 0.17 35); --accent-soft:oklch(0.96 0.03 35); }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,sans-serif; }
  .empty { color:var(--mute); padding:60px 0; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; align-items:start; }
  .board { background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .board h2 { margin:0; font-size:15px; display:flex; align-items:baseline; gap:8px; }
  .board h2 .id { font:700 11px ui-monospace,monospace; background:var(--ink); color:#fff; border-radius:4px; padding:2px 6px; }
  .board h2 .dur { margin-left:auto; font:500 12px ui-monospace,monospace; color:var(--mute); }
  .strategy { margin:0; color:var(--mute); font-size:13px; }
  .bar { display:flex; gap:2px; height:8px; }
  .bar i { display:block; background:var(--line); border-radius:2px; }
  .bar i.sel { background:var(--accent); }
  .scene { text-align:left; width:100%; font:inherit; color:inherit; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
  .scene:hover { border-color:var(--ink); }
  .scene.sel { border:1.5px solid var(--accent); background:var(--accent-soft); }
  .scene .top { display:flex; gap:8px; align-items:baseline; font-weight:600; }
  .scene .n { font:600 11px ui-monospace,monospace; color:var(--mute); }
  .scene .t { margin-left:auto; font:500 11px ui-monospace,monospace; color:var(--mute); font-weight:400; }
  .scene .v, .scene .m { font-size:12.5px; color:#444; }
  .scene .m { color:var(--mute); font-style:italic; }
  .scene .txt { font:600 12px ui-monospace,monospace; color:var(--accent); }
  .hint { margin:0 0 12px; color:var(--mute); font-size:12.5px; }
</style>
</head>
<body>
<div id="root"><div class="empty">Waiting for storyboards…</div></div>
<script>
  // Template contract: renders ./storyboards.json. Clicking a scene tells the host app to scope the next chat note to it.
  let selected = null;
  const root = document.getElementById('root');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function load() {
    let data;
    try { data = await (await fetch('./storyboards.json', { cache: 'no-store' })).json(); }
    catch { root.innerHTML = '<div class="empty">No storyboards yet. Describe your launch in the chat.</div>'; return; }
    render(data.boards || []);
  }

  function render(boards) {
    root.innerHTML = '<p class="hint">Click a scene to leave a note on exactly that scene.</p><div class="grid">' + boards.map(b => {
      const total = b.scenes.reduce((a, s) => a + (s.endSec - s.startSec), 0) || 1;
      const isSel = s => selected && selected.board === b.id && selected.scene === s.n;
      return `<section class="board">
        <h2><span class="id">${esc(b.id)}</span>${esc(b.name)}<span class="dur">${esc(b.durationSec)}s</span></h2>
        <p class="strategy">${esc(b.strategy)}</p>
        <div class="bar">${b.scenes.map(s => `<i class="${isSel(s) ? 'sel' : ''}" style="flex:${s.endSec - s.startSec}" title="${esc(s.title)}"></i>`).join('')}</div>
        ${b.scenes.map(s => `<button class="scene ${isSel(s) ? 'sel' : ''}" data-b="${esc(b.id)}" data-n="${s.n}" data-t="${esc(s.title)}">
          <span class="top"><span class="n">${s.n}</span>${esc(s.title)}<span class="t">${s.startSec}–${s.endSec}s</span></span>
          <span class="v">${esc(s.visual)}</span>
          ${s.motion ? `<span class="m">${esc(s.motion)}</span>` : ''}
          ${s.onScreenText ? `<span class="txt">“${esc(s.onScreenText)}”</span>` : ''}
        </button>`).join('')}
      </section>`;
    }).join('') + '</div>';
    root.querySelectorAll('.scene').forEach(el => el.addEventListener('click', () => {
      selected = { board: el.dataset.b, scene: Number(el.dataset.n), title: el.dataset.t };
      parent.postMessage({ type: 'lva.scope', ...selected }, '*');
      render(boards);
    }));
  }
  load();
</script>
</body>
</html>
