<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<!--
  STARTING POINT, not a final page. Copy to ../../video.html. READ _lva/engine.js FIRST: its USAGE block is the
  contract (everything is a pure function of T; scene list literal; one file per scene).
  Keep, in this order: the LVA_SCENES literal in a plain inline script; React, ReactDOM, Babel from /vendor;
  _lva/engine.js; one text/babel script per scene file; one final text/babel script that mounts <Composition>.
  A Google Fonts <link> is allowed for typography. Nothing else external.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
<script>window.LVA_SCENES = '[{"name":"Hook","dur":3,"desc":"The product name slams in on a dark field"},{"name":"CTA","dur":2,"desc":"The URL settles in the center"}]';</script>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="/vendor/babel.js"></script>
<script src="_lva/engine.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="scenes/01-hook.jsx"></script>
<script type="text/babel" src="scenes/02-cta.jsx"></script>
<script type="text/babel">
  // The whole video: every scene renders all the time, each decides what to show from T.
  function Piece() {
    return (
      <>
        <Hook />
        <Cta />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Composition width={1920} height={1080} scenes={window.LVA_SCENES} bg="#08090b">
      <Piece />
    </Composition>
  );
</script>
</body>
</html>
