<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard</title>
<!-- One-click STORY feedback for a selected frame. Story notes, not polish notes. Keep or adapt. -->
<meta name="lva:chips" content='[["Stronger hook","Make the hook stronger: open on the sharpest, most surprising moment."],["Cut this beat","Cut this beat."],["Swap with previous","Swap this beat with the previous one."],["Add a beat before","Add a short beat before this one that sets it up."],["Shorter","Make this beat shorter."]]'>
<!--
  STARTING POINT. Copy to storyboard.html and replace the sample content.

  AN INFINITE WHITE CANVAS holding every VERSION of the story, newest on top. Pan (scroll or drag) and zoom (pinch or
  ctrl+scroll) are built in (the script at the bottom; do not rewrite it); double-click empty space to fit the newest
  version. The user reviews the STORY (hook, order, payoff), at MID FIDELITY: the product must be RECOGNIZABLE in every
  frame (its real layout, labels and copy, its own theme and a few of its real colors used flat, its real icons), but
  simplified: few elements, flat fills, no shadows or gradients, no pixel polish. Placeholders only for imagery, video
  and art. The words in a frame are the words that will appear on screen, never bracketed descriptions. A normal
  sans-serif font; no handwriting fonts. No buttons or controls: the user answers in chat and you guide the next step
  there. Open _lva/references/storyboard-example.html to see the bar.

  VERSIONS. The first story is v1. Every revision (a user note, a chip, your own improvement) becomes a NEW version:
  insert a new <section class="version"> directly below the VERSIONS marker comment (newest on top), as a full copy
  of the previous version with the changes applied. Mark changed frames with class="changed" (a dot). Say in one
  sentence what changed and why. NEVER edit or delete an older version. Keep the hidden plan (#lva-plan) equal to
  the NEWEST version. Only the newest version carries "Open questions" (at most 3 real story decisions, or omit it).
  The "latest" badge is automatic (CSS).

  FORMAT. Set --fw / --fh (frame size) and --cols on :root to match the video: 16:9 → 400px 225px, 4 columns;
  9:16 → 225px 400px, 6 columns; 1:1 → 300px 300px, 5 columns. Place wireframe elements with % so they scale.

  CONTRACT, keep it:
    - <section class="version" data-lva-version="vN"> per version
    - <figure class="card" data-lva-beat data-lva-scene="<n>" data-lva-title="<title>"> per beat inside it
    - the hidden plan  <script type="application/json" id="lva-plan">  (per beat: title, start, end, on-screen text,
      what is on screen, motion). You build the video from it; it is never shown.
    - <script src="_lva/bridge.js"></script> at the end of <body>
-->
<style>
  :root { --fw:400px; --fh:225px; --cols:4; --ink:#1c1b19; --mute:#6b6963; --g1:#f4f3ef; --g2:#e5e3dd; --g3:#d2cfc7; --g4:#b4b0a6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#fff; color:var(--ink); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif; }

  /* the infinite canvas: #versions is moved by transform; everything else is plain HTML */
  #vp { position:fixed; inset:0; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  #versions { position:absolute; left:0; top:0; transform-origin:0 0; width:max-content; padding:80px; display:flex; flex-direction:column; gap:130px; }
  #versions.anim { transition:transform .35s cubic-bezier(.2,.7,.2,1); }

  /* a version */
  .version { display:flex; flex-direction:column; gap:26px; }
  .vtag { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  .chip { font:600 13px ui-monospace,Menlo,monospace; background:var(--ink); color:#f6f5f2; padding:3px 9px; border-radius:4px; }
  .version:first-of-type .vtag::after { content:"latest"; font-size:11px; border:1px solid var(--g3); border-radius:10px; padding:1px 9px; color:var(--mute); }
  .vmeta { font:500 12px ui-monospace,Menlo,monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .vhead h2 { margin:0; font-size:28px; font-weight:600; letter-spacing:-.01em; }
  .vnote { margin:8px 0 0; font-size:16px; line-height:1.5; color:var(--mute); max-width:820px; }
  .frames { display:grid; grid-template-columns:repeat(var(--cols),var(--fw)); gap:44px 32px; }

  /* a frame card */
  .card { margin:0; width:var(--fw); display:flex; flex-direction:column; gap:12px; cursor:pointer; }
  .card .cap { display:flex; gap:10px; align-items:baseline; }
  .num { font:600 12px ui-monospace,Menlo,monospace; background:var(--ink); color:#f6f5f2; padding:2px 7px; border-radius:4px; }
  .time { font:12px ui-monospace,Menlo,monospace; color:var(--mute); }
  .card p { margin:0; font-size:15px; line-height:1.45; }
  .card.lva-selected .wf { outline:3px solid var(--ink); outline-offset:3px; }
  .card.changed .wf::after { content:""; position:absolute; top:9px; right:9px; width:10px; height:10px; border-radius:50%; background:var(--ink); box-shadow:0 0 0 3px var(--g1); }

  /* the frame sheet. Fill it with a simplified mock of the PRODUCT (see the sample frames and the reference example) */
  .wf { position:relative; width:var(--fw); height:var(--fh); background:var(--g1); border:1px solid var(--g3); border-radius:10px; overflow:hidden; font-size:11px; color:#5d5a53; }
  .ph { background:repeating-linear-gradient(45deg,var(--g2) 0 7px,var(--g1) 7px 14px); color:#6b6963; display:flex; align-items:center; justify-content:center; text-align:center; }   /* imagery / video / art placeholder only */

  .questions { max-width:900px; border:1px dashed var(--g4); border-radius:10px; padding:14px 18px; background:var(--g1); }
  .questions h3 { margin:0 0 6px; font:600 12px ui-monospace,Menlo,monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
  .questions p { margin:0 0 4px; font-size:15px; line-height:1.5; }
</style>
</head>
<body>
<div id="vp"><main id="versions">

  <!-- VERSIONS: newest first. Insert each new version section directly below this comment. -->
  <section class="version" data-lva-version="v1">
    <div class="vhead">
      <div class="vtag"><span class="chip">v1</span><span class="vmeta">1920×1080 (16:9) · ~9s</span></div>
      <h2>A title for this version of the story</h2>
      <p class="vnote">One or two sentences: the story in this version, and (from v2 on) what changed and why.</p>
    </div>
    <div class="frames">
      <figure class="card" data-lva-beat data-lva-scene="1" data-lva-title="Hook">
        <div class="wf" style="background:#fbfaf7;display:flex;align-items:center;justify-content:center;padding:0 9%">
          <div style="font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:#1c1b19">Your tickets, handled before you open them.</div>
        </div>
        <div class="cap"><span class="num">01</span><span class="time">0.0–3.0s</span></div>
        <p><b>Hook.</b> The sharpest claim, as the headline, in the product's own theme and type.</p>
      </figure>
      <figure class="card" data-lva-beat data-lva-scene="2" data-lva-title="Product">
        <div class="wf" style="background:#fbfaf7;display:grid;grid-template-columns:30% 1fr">
          <div style="background:#f1efe9;border-right:1px solid #e3e0d8;padding:10px 9px;display:flex;flex-direction:column;gap:5px;font-size:9px;color:#5d5a53">
            <div style="font-weight:700;color:#1c1b19;font-size:10px">◆ Acme</div><div>Inbox</div><div style="background:#e5e2da;border-radius:4px;padding:2px 4px;color:#1c1b19">My issues</div><div>Cycles</div><div>Projects</div>
          </div>
          <div style="padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:9px;color:#1c1b19">
            <div style="font-weight:700;font-size:11px;margin-bottom:2px">My issues</div>
            <div style="display:flex;gap:6px;align-items:center;border-bottom:1px solid #eceae3;padding:3px 0"><span style="color:#d98a2b">●</span>Checkout fails on expired coupon<span style="margin-left:auto;color:#8a867d">ACM-241</span></div>
            <div style="display:flex;gap:6px;align-items:center;border-bottom:1px solid #eceae3;padding:3px 0"><span style="color:#8a867d">○</span>Migrate auth to new session store<span style="margin-left:auto;color:#8a867d">ACM-238</span></div>
            <div style="display:flex;gap:6px;align-items:center;padding:3px 0"><span style="color:#2f8f5b">✓</span>Fix flaky e2e test in CI<span style="margin-left:auto;color:#8a867d">ACM-233</span></div>
          </div>
        </div>
        <div class="cap"><span class="num">02</span><span class="time">3.0–7.0s</span></div>
        <p><b>Product.</b> The real screen, simplified: its sidebar, its list, its labels. The one thing the video is about happens here.</p>
      </figure>
      <figure class="card" data-lva-beat data-lva-scene="3" data-lva-title="Call to action">
        <div class="wf" style="background:#1c1b19;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
          <div style="font-size:28px;font-weight:700;color:#fbfaf7;letter-spacing:-.02em">◆ Acme</div>
          <div style="font-size:12px;color:#d98a2b">acme.com</div>
        </div>
        <div class="cap"><span class="num">03</span><span class="time">7.0–9.0s</span></div>
        <p><b>Call to action.</b> The real wordmark, drawn as text in the brand's style, and the URL, held long enough to read.</p>
      </figure>
    </div>
    <aside class="questions"><h3>Open questions</h3><p>Optional, newest version only: up to three real story decisions for the user.</p></aside>
  </section>

</main></div>

<script type="application/json" id="lva-plan">
{ "beats": [
  { "title": "Hook", "start": 0, "end": 3, "onScreenText": "…", "onScreen": "…", "motion": "…" },
  { "title": "Product", "start": 3, "end": 7, "onScreenText": "…", "onScreen": "…", "motion": "…" },
  { "title": "Call to action", "start": 7, "end": 9, "onScreenText": "…", "onScreen": "…", "motion": "…" }
] }
</script>
<script>
// Canvas behaviour only: pan (scroll or drag), zoom (pinch / ctrl+scroll), double-click empty space to fit the newest.
(() => {
  const vp = document.getElementById("vp"), world = document.getElementById("versions");
  let z = 1, x = 0, y = 0, drag = null, moved = false;
  const apply = (anim) => {
    if (anim) { world.classList.add("anim"); setTimeout(() => world.classList.remove("anim"), 400); }
    world.style.transform = `translate(${x}px,${y}px) scale(${z})`;
  };
  const fit = (anim) => {
    const el = world.querySelector(".version");
    if (!el) return;
    const vw = innerWidth, vh = innerHeight, w = el.offsetWidth, h = el.offsetHeight;
    z = Math.min((vw - 100) / w, (vh - 100) / h, 1.2);
    x = (vw - w * z) / 2 - el.offsetLeft * z;
    y = h * z < vh - 100 ? (vh - h * z) / 2 - el.offsetTop * z : 50 - el.offsetTop * z;
    apply(anim);
  };
  const zoomAt = (cx, cy, nz) => {
    nz = Math.max(0.08, Math.min(3, nz));
    x = cx - (cx - x) * (nz / z); y = cy - (cy - y) * (nz / z); z = nz; apply();
  };
  vp.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, z * Math.exp(-e.deltaY * 0.01));
    else { x -= e.deltaX; y -= e.deltaY; apply(); }
  }, { passive: false });
  vp.addEventListener("pointerdown", (e) => { if (e.button === 0) { drag = { sx: e.clientX, sy: e.clientY, x, y }; moved = false; } });
  addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    if (moved) { x = drag.x + dx; y = drag.y + dy; vp.style.cursor = "grabbing"; apply(); }
  });
  addEventListener("pointerup", () => { drag = null; vp.style.cursor = ""; });
  addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true); // a drag is not a click
  vp.addEventListener("dblclick", (e) => { if (!e.target.closest(".card")) fit(true); });
  addEventListener("resize", () => fit(false));
  fit(false);
})();
</script>
<script src="_lva/bridge.js"></script>
</body>
</html>
